name: Deploy

on:
  push:
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # Railway and Vercel both watch the main branch and deploy automatically
  # via their native GitHub integrations. CI must pass before anything can
  # merge to main (branch protection rule), so this job simply confirms
  # that a production deploy has been triggered.
  notify:
    name: Production deploy triggered
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### Production Deploy Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Railway** (backend) is deploying automatically" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel** (frontend) is deploying automatically" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
